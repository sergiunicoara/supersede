# Plain-language descriptions of every (subject.predicate) key in the corpus. Relate's full-text index
# is built over these, so `ask()` can find a key from a question. FICTIONAL data.
retained_sample.retention_period: "How long retained samples (reference samples kept from production lots) must be kept; the retention or storage period for samples, archive time."
customer_notification.hours: "How quickly the customer must be notified of a problem or a nonconformance, in hours; the notification deadline."
supplier_audit.frequency: "How often suppliers are audited; the supplier audit interval or frequency."
supplier_audit.on_site_notice_days: "How many days of notice a supplier gets before an on-site audit; the announcement lead time in days."
paint_line.film_thickness_um: "The required paint film thickness on the paint line, in micrometres (microns); the coating thickness range."
paint_line.cure_time_min: "How many minutes paint must cure on the paint line; the curing time."
final_inspection.sampling: "The sampling rule for final inspection: how many parts are inspected, the inspection level, AQL or 100% inspection."
final_inspection.record_retention: "How long final inspection records are kept; the record keeping period for inspection results."
final_inspection.record_form: "Which form is used to record final inspection results; the inspection record form number."
gauge_calibration.interval: "How often measuring gauges are calibrated; the calibration interval or period."
machining_cell.tool_change_interval: "After how many parts the cutting tools in the machining cell are changed; the tool change interval or tool life."
line_3.changeover_target_min: "The target time in minutes for a changeover (a setup change) on line 3."
furnace_loading.preheat_minutes: "How many minutes the furnace must be preheated before it is loaded."
furnace_loading.max_basket_kg: "The maximum weight in kilograms of one furnace basket load."
fastening.head_bolt_torque: "The tightening torque for the cylinder head bolts, in newton metres."
fastening.cover_bolt_torque: "The tightening torque for the cover bolts, in newton metres."
fastening.thread_locker: "Whether thread locking compound (thread locker) is required on bolts."
leak_test.retest_allowed: "Whether a part that fails the leak test may be retested; the retest rule."
leak_test.pressure_bar: "The test pressure used for the leak test, in bar."
