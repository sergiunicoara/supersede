[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supersede"
version = "0.1.0"
description = "Revision-aware agent memory on Relate: knows which fact is currently in force, and why."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sergiu Nicoară" }]
dependencies = ["relate-db>=1.2.0,<1.3", "mcp>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6,<7"]
llm = ["anthropic"]  # only for `examples/demo_session.py --llm`

[project.scripts]
supersede-mcp = "supersede.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
