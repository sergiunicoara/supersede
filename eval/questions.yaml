# Measured question set over examples/corpus (FICTIONAL data).
# Case slugs are defined in examples/corpus/CASES.md.
# expected_value / expected_source are omitted where there is none (unknown, unresolved).
# For `resolved` the source must equal expected_source; for `agreed` expected_source must be
# one of the revisions listed in the answer's sources.
questions:
  - {id: q01, case: stale, subject: gauge_calibration, predicate: interval, expected_status: agreed, expected_value: "6 months", expected_source: QP-11-r2}
  - {id: q02, case: stale, subject: paint_line, predicate: cure_time_min, expected_status: agreed, expected_value: "35", expected_source: WI-21-r2}
  - {id: q03, case: authority, subject: final_inspection, predicate: sampling, expected_status: resolved, expected_value: "AQL 0.65", expected_source: QP-07-r3}
  - {id: q04, case: authority, subject: retained_sample, predicate: retention_period, expected_status: resolved, expected_value: "10 years", expected_source: CSR-VEL-01-r2}
  - {id: q05, case: authority, subject: paint_line, predicate: film_thickness_um, expected_status: resolved, expected_value: "70-90", expected_source: CSR-KOR-01-r1}
  - {id: q06, case: unresolved, subject: machining_cell, predicate: tool_change_interval, expected_status: unresolved}
  - {id: q07, case: unresolved, subject: line_3, predicate: changeover_target_min, expected_status: unresolved}
  - {id: q08, case: agreed, subject: supplier_audit, predicate: frequency, expected_status: agreed, expected_value: "annual", expected_source: QP-18-r3}
  - {id: q09, case: agreed, subject: customer_notification, predicate: hours, expected_status: agreed, expected_value: "24", expected_source: CSR-VEL-01-r2}
  - {id: q10, case: unknown, subject: heat_treat_furnace, predicate: max_temp_c, expected_status: unknown}
  - {id: q11, case: unknown, subject: final_inspection, predicate: paint_color, expected_status: unknown}
  - {id: q12, case: chain, subject: final_inspection, predicate: record_retention, expected_status: agreed, expected_value: "5 years", expected_source: QP-07-r3}
  - {id: q13, case: chain, subject: supplier_audit, predicate: on_site_notice_days, expected_status: agreed, expected_value: "7", expected_source: QP-18-r3}
  # cases where supersession and effective dates disagree (see examples/corpus/CASES.md)
  - {id: q14, case: missing_date, subject: furnace_loading, predicate: preheat_minutes, expected_status: agreed, expected_value: "30", expected_source: WI-31-r2}
  - {id: q15, case: missing_date, subject: furnace_loading, predicate: max_basket_kg, expected_status: agreed, expected_value: "300", expected_source: WI-31-r2}
  - {id: q16, case: date_error, subject: fastening, predicate: head_bolt_torque, expected_status: agreed, expected_value: "48 Nm", expected_source: QP-22-r2}
  - {id: q17, case: date_error, subject: fastening, predicate: cover_bolt_torque, expected_status: agreed, expected_value: "24 Nm", expected_source: QP-22-r2}
  - {id: q18, case: withdrawn, subject: leak_test, predicate: retest_allowed, expected_status: unknown}
  - {id: q19, case: withdrawn, subject: fastening, predicate: thread_locker, expected_status: unknown}

# Cross-document lineage (DERIVED_FROM). The baselines keep no such structure, so they are not scored here.
lineage:
  - id: l1
    case: lineage
    ask: stale_derivations
    expected:
      - {revision: SN-0914-r1, source: CSR-VEL-01-r1, hops: 1, replaced_by: [CSR-VEL-01-r2]}
      - {revision: WI-12-r1, source: QP-07-r1, hops: 1, replaced_by: [QP-07-r3]}
      - {revision: WI-52-r1, source: QP-07-r1, hops: 2, replaced_by: [QP-07-r3]}
  - id: l2
    case: lineage
    ask: lineage
    revision: WI-52-r1
    expected:
      - {source: WI-12-r1, hops: 1, current: true, replaced_by: []}
      - {source: QP-07-r1, hops: 2, current: false, replaced_by: [QP-07-r3]}
  - id: l3
    case: lineage
    ask: lineage
    revision: WI-24-r1
    expected:
      - {source: WI-20-r1, hops: 1, current: true, replaced_by: []}

# Plain-language questions for ask(): retrieval finds the topic, the graph decides the value.
# Written as a person would phrase them, with paraphrases, ambiguous wording and off-topic questions.
# expected_key null = nothing in the knowledge base answers it (status no_match).
retrieval:
  - {id: r01, question: "For how long do we have to store the reference samples we keep from each lot?", expected_key: retained_sample.retention_period, expected_status: resolved, expected_value: "10 years"}
  - {id: r02, question: "What time limit does the customer give us to report a quality problem?", expected_key: customer_notification.hours, expected_status: agreed, expected_value: "24"}
  - {id: r03, question: "How frequently do you audit your suppliers?", expected_key: supplier_audit.frequency, expected_status: agreed, expected_value: "annual"}
  - {id: r04, question: "How much advance warning is a supplier given before an audit visit on site?", expected_key: supplier_audit.on_site_notice_days, expected_status: agreed, expected_value: "7"}
  - {id: r05, question: "What thickness should the paint coat be?", expected_key: paint_line.film_thickness_um, expected_status: resolved, expected_value: "70-90"}
  - {id: r06, question: "How long does the paint have to bake?", expected_key: paint_line.cure_time_min, expected_status: agreed, expected_value: "35"}
  - {id: r07, question: "Which inspection level do we use on finished parts?", expected_key: final_inspection.sampling, expected_status: resolved, expected_value: "AQL 0.65"}
  - {id: r08, question: "How long do we keep the records of the final inspection?", expected_key: final_inspection.record_retention, expected_status: agreed, expected_value: "5 years"}
  - {id: r09, question: "Which form do inspectors fill in for final inspection results?", expected_key: final_inspection.record_form, expected_status: agreed, expected_value: "FORM-9"}
  - {id: r10, question: "How often must we calibrate our gauges?", expected_key: gauge_calibration.interval, expected_status: agreed, expected_value: "6 months"}
  - {id: r11, question: "After how many parts do we swap the cutting tools in the machining cell?", expected_key: machining_cell.tool_change_interval, expected_status: unresolved}
  - {id: r12, question: "What changeover time are we aiming for on line 3?", expected_key: line_3.changeover_target_min, expected_status: unresolved}
  - {id: r13, question: "How long should the furnace warm up before loading?", expected_key: furnace_loading.preheat_minutes, expected_status: agreed, expected_value: "30"}
  - {id: r14, question: "What is the heaviest load we may put in a furnace basket?", expected_key: furnace_loading.max_basket_kg, expected_status: agreed, expected_value: "300"}
  - {id: r15, question: "What torque do we use on the cylinder head bolts?", expected_key: fastening.head_bolt_torque, expected_status: agreed, expected_value: "48 Nm"}
  - {id: r16, question: "How tight do the cover bolts need to be?", expected_key: fastening.cover_bolt_torque, expected_status: agreed, expected_value: "24 Nm"}
  - {id: r17, question: "Do we still need thread locker on the bolts?", expected_key: fastening.thread_locker, expected_status: unknown}
  - {id: r18, question: "Can a part that failed the leak test be tried again?", expected_key: leak_test.retest_allowed, expected_status: unknown}
  - {id: r19, question: "At what pressure is the leak test run?", expected_key: leak_test.pressure_bar, expected_status: agreed, expected_value: "2.5"}
  - {id: r20, question: "What is the lunch break schedule for the night shift?", expected_key: null, expected_status: no_match}
  - {id: r21, question: "Who is the plant manager?", expected_key: null, expected_status: no_match}
  - {id: r22, question: "What colour are the delivery trucks?", expected_key: null, expected_status: no_match}
  - {id: r23, question: "How many holidays do employees get?", expected_key: null, expected_status: no_match}

